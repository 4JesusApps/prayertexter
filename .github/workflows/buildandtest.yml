name: Compile and run tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

      - name: Integration tests
        run: go test -tags integration -v ./internal/integration/...